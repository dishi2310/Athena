<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#263c53"/>

  <!-- Owl eyes — Athena symbol -->
  <circle cx="22" cy="26" r="7" fill="#ffffff" opacity="0.12"/>
  <circle cx="42" cy="26" r="7" fill="#ffffff" opacity="0.12"/>
  <circle cx="22" cy="26" r="4.5" fill="#7eb5e9"/>
  <circle cx="42" cy="26" r="4.5" fill="#7eb5e9"/>
  <circle cx="23.2" cy="24.8" r="1.6" fill="#ffffff"/>
  <circle cx="43.2" cy="24.8" r="1.6" fill="#ffffff"/>

  <!-- Beak -->
  <polygon points="32,31 29,36 35,36" fill="#f0c040"/>

